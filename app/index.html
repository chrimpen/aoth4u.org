<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>ΑΟΘ4U · aoth4u.org/app</title>
  <style>
    * { box-sizing:border-box }
    body { margin:0; color:#25443e; background:#faf8f3; font:17px/1.55 system-ui,sans-serif }
    [hidden] { display:none !important }
    header { display:flex; align-items:center; gap:1rem; padding:14px clamp(16px,4vw,48px); background:#fff; border-bottom:1px solid #d6e2dc }
    header a { display:inline-flex; align-items:center; gap:12px; color:inherit; text-decoration:none; font-weight:700 }
    header img { width:40px; height:40px; object-fit:contain }
    main { max-width:620px; margin:clamp(40px,12vh,110px) auto; padding:0 24px }
    h1 { font-size:clamp(2rem,6vw,3.1rem); line-height:1.12; margin:0 0 1rem }
    nav { display:flex; gap:.8rem; flex-wrap:wrap; margin:1.6rem 0 }
    nav a { padding:11px 20px; border-radius:12px; color:#25443e; border:1px solid #647e75; background:white; text-decoration:none; font-weight:700 }
    nav a:first-child { background:#a32c48; border-color:#a32c48; color:white }
    a:focus-visible { outline:3px solid #194e70; outline-offset:3px }
    #app { position:fixed; inset-inline:0; top:var(--screen-top,0px); height:var(--screen-height,100dvh); background:#fff }
    iframe { width:100%; height:100%; display:block; border:0 }
  </style>
</head>
<body>
  <header><a href="/"><img src="/FB%20logo.png" alt="">ΑΟΘ4U</a></header>
  <main id="entry">
    <h1>ΑΟΘ4U · Πανελλήνιες</h1>
    <p>Εξασκήσου σε θέματα Πανελληνίων, συμπλήρωσε τα κενά της θεωρίας και δες την πρόοδό σου.</p>
    <nav aria-label="Λογαριασμός μαθητή">
      <a href="https://aoth4u-panellinies.chrimpen0.chatgpt.site/?mode=signup" id="signup">Εγγραφή</a>
      <a href="https://aoth4u-panellinies.chrimpen0.chatgpt.site/" id="signin">Σύνδεση</a>
    </nav>
  </main>
  <section id="app" aria-label="ΑΟΘ4U · Πανελλήνιες" hidden>
    <iframe title="Εφαρμογή ΑΟΘ4U · Πανελλήνιες" referrerpolicy="no-referrer"></iframe>
  </section>
  <script>
    const shell = document.getElementById('app');
    const frame = shell.querySelector('iframe');
    const origin = "https://aoth4u-panellinies.chrimpen0.chatgpt.site";
    const viewport = window.visualViewport;
    function fitScreen() {
      if (shell.hidden || (viewport && Math.abs(viewport.scale - 1) > 0.05)) return;
      shell.style.setProperty('--screen-top', (viewport?.offsetTop ?? 0) + 'px');
      shell.style.setProperty('--screen-height', (viewport?.height ?? window.innerHeight) + 'px');
    }
    function showApp(url) {
      document.getElementById('entry').hidden = true;
      document.querySelector('header').hidden = true;
      shell.hidden = false;
      fitScreen();
      url.searchParams.set('embed','aoth4u');
      frame.src = url.href;
    }
    function showEntry() {
      shell.hidden = true;
      frame.removeAttribute('src');
      document.getElementById('entry').hidden = false;
      document.querySelector('header').hidden = false;
    }
    function route() {
      const page = new URL(window.location.href);
      const action = page.searchParams.get('action');
      const confirmation = new URLSearchParams(page.hash.slice(1));
      const hash = confirmation.get('token_hash'), type = confirmation.get('type');
      if (hash && /^[a-zA-Z0-9_-]{20,256}$/.test(hash) && ['signup','email','recovery'].includes(type)) {
        const target = new URL('/auth/confirm', origin);
        target.searchParams.set('token_hash', hash);
        target.searchParams.set('type', type);
        history.replaceState(null,'',page.pathname+'?action=signin');
        showApp(target);
      } else if (action === 'signup' || action === 'signin') {
        const target = new URL('/', origin);
        if (action === 'signup') target.searchParams.set('mode', 'signup');
        showApp(target);
      } else showEntry();
    }
    for (const action of ['signup','signin']) {
      document.getElementById(action).addEventListener('click', event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        history.pushState(null,'',location.pathname + '?action=' + action);
        route();
      });
    }
    viewport?.addEventListener('resize',fitScreen);
    viewport?.addEventListener('scroll',fitScreen);
    window.addEventListener('resize',fitScreen);
    window.addEventListener('popstate',route);
    route();
  </script>
</body>
</html>
